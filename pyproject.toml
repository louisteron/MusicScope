[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="musicscope"
version="0.1.0a6"
description="An audio-reactive OpenGL visualiser for Raspberry Pi."
readme="README.md"
requires-python=">=3.13"
dependencies=[
    "certifi>=2025.1.31",
    "glfw>=2.8.0",
    "moderngl>=5.12.0",
    "mutagen>=1.47.0",
    "numpy>=2.1.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
cd=["discid>=1.2.0"]
dev=["pytest>=8.3.0", "ruff>=0.8.0"]
release = [
    "pyinstaller>=6.0",
]

[project.scripts]
musicscope="musicscope.__main__:main"

[tool.hatch.build.targets.wheel]
packages=["src/musicscope"]

[tool.hatch.build.targets.wheel.force-include]
"src/musicscope/assets/frog.jpg" = "musicscope/assets/frog.jpg"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
