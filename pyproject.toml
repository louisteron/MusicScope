[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="musicscope"
version="0.1.0"
description="An audio-reactive OpenGL visualiser for Raspberry Pi."
readme="README.md"
requires-python=">=3.13"
dependencies=[
    "certifi>=2025.1.31",
    "glfw>=2.8.0",
    "moderngl>=5.12.0",
    "numpy>=2.1.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "sounddevice>=0.5.0",
]

[project.optional-dependencies]
dev=["pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
musicscope="musicscope.__main__:main"

[tool.hatch.build.targets.wheel]
packages=["src/musicscope"]

[tool.hatch.build.targets.wheel.force-include]
"src/musicscope/assets/frog.jpg" = "musicscope/assets/frog.jpg"
"src/musicscope/assets/logo-jvb.png" = "musicscope/assets/logo-jvb.png"
"src/musicscope/assets/logo-ram.png" = "musicscope/assets/logo-ram.png"
"src/musicscope/assets/disc-cd.png" = "musicscope/assets/disc-cd.png"
"src/musicscope/assets/disc-vinyl.png" = "musicscope/assets/disc-vinyl.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
