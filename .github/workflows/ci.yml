name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libportaudio2
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
