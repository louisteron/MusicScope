name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.1.0-alpha.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            source: dist/MusicScope.app
          - name: linux-x86_64
            os: ubuntu-24.04
            source: dist/MusicScope
          - name: windows-x86_64
            os: windows-2022
            source: dist/MusicScope
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libportaudio2 libpulse0
      - run: uv sync --extra release
      - run: uv run pyinstaller --noconfirm --clean packaging/musicscope.spec
      - name: Smoke test the frozen macOS app
        if: runner.os == 'macOS'
        run: dist/MusicScope.app/Contents/MacOS/MusicScope --help
      - name: Smoke test the frozen Linux app
        if: runner.os == 'Linux'
        run: dist/MusicScope/MusicScope --help
      - name: Smoke test the frozen Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& dist/MusicScope/MusicScope.exe --help'
      - name: Ad-hoc sign the macOS application
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - --timestamp=none dist/MusicScope.app
      - name: Verify the macOS application signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/MusicScope.app
      - name: Bundle mpv runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod `
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-x86_64-v3-.*\.7z$' } |
            Select-Object -First 1
          if ($null -eq $asset) {
            throw 'No x86_64 mpv archive was found in the upstream release.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'musicscope-mpv.7z'
          $extractDirectory = Join-Path $env:RUNNER_TEMP 'musicscope-mpv'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          7z x $archive "-o$extractDirectory" -y
          $mpv = Get-ChildItem $extractDirectory -Filter mpv.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $mpv) {
            throw 'mpv.exe was not found after extracting the upstream archive.'
          }
          $destination = Join-Path $PWD 'dist/MusicScope/mpv'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$($mpv.Directory.FullName)/*" $destination -Recurse -Force
      - run: >
          uv run python packaging/archive.py
          ${{ matrix.source }}
          dist/MusicScope-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MusicScope-${{ matrix.name }}
          path: dist/MusicScope-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: release/**/*.zip
